name: Update hub

# Rebuilds index.html from projects.json + the live public repo list, daily
# and on demand. Only commits when the rebuilt page actually changed.
# No personal token needed: the built-in GITHUB_TOKEN pushes to this repo.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate hub index
        run: python3 scripts/generate_hub.py
      - name: Commit if changed
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update hub: rebuild from live repos"
          git push
